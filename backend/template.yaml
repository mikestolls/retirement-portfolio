AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Retirement Portfolio Lambda Functions and API Gateway'

Parameters:
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
      - CRITICAL
    Description: Log level for Lambda functions

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    Environment:
      Variables:
        DYNAMODB_ENDPOINT_URL: !If [IsLocal, "http://localhost:8000", !Ref "AWS::NoValue"]
        USERS_TABLE: users
        FAMILIES_TABLE: families
        RETIREMENT_FUNDS_TABLE: retirement_funds
        BUDGETS_TABLE: budgets
        LOG_LEVEL: !Ref LogLevel
    Layers:
      - !Ref SharedLayer
  Api:
    Cors:
      AllowMethods: "'GET,POST,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"

Conditions:
  IsLocal: !Equals [!Ref "AWS::StackName", "local"]

Resources:
  # Shared Layer
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: retirement-portfolio-shared
      Description: Shared code for retirement portfolio functions
      ContentUri: layers/shared/
      CompatibleRuntimes:
        - python3.12

  # Lambda Functions
  OptionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/options/
      Handler: handler.lambda_handler
      Events:
        OptionsApi:
          Type: Api
          Properties:
            Path: /api/{proxy+}
            Method: options

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/health/
      Handler: handler.lambda_handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/health
            Method: get

  GetUserDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/get-user-data/
      Handler: handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: users
        - DynamoDBReadPolicy:
            TableName: families
        - DynamoDBReadPolicy:
            TableName: retirement_funds
        - DynamoDBReadPolicy:
            TableName: budgets
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:ListTables
                - dynamodb:CreateTable
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:BatchGetItem
              Resource: "*"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/users/{user_id}/data
            Method: get

  GetUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/get-user/
      Handler: handler.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: users
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:ListTables
                - dynamodb:CreateTable
                - dynamodb:GetItem
              Resource: "*"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/users/{user_id}
            Method: get

  UpdateUserDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/update-user-data/
      Handler: handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: users
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:ListTables
                - dynamodb:CreateTable
              Resource: "*"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/users/{user_id}
            Method: post

  UpdateFamilyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/update-family-info/
      Handler: handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: families
        - DynamoDBReadPolicy:
            TableName: retirement_funds
        - DynamoDBCrudPolicy:
            TableName: retirement_funds
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:ListTables
                - dynamodb:CreateTable
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:BatchGetItem
                - dynamodb:UpdateItem
              Resource: "*"
      Events:
        ApiUpdate:
          Type: Api
          Properties:
            Path: /api/family_info/{family_id}
            Method: post
        ApiCreate:
          Type: Api
          Properties:
            Path: /api/family_info
            Method: post

  UpdateFundFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/update-retirement-fund/
      Handler: handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: retirement_funds
        - DynamoDBReadPolicy:
            TableName: families
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:ListTables
                - dynamodb:CreateTable
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:BatchGetItem
              Resource: "*"
      Events:
        ApiPost:
          Type: Api
          Properties:
            Path: /api/retirement_fund/{fund_id}
            Method: post
        ApiDelete:
          Type: Api
          Properties:
            Path: /api/retirement_fund/{fund_id}
            Method: delete
        ApiCreate:
          Type: Api
          Properties:
            Path: /api/retirement_fund
            Method: post

  UpdateBudgetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/update-budget/
      Handler: handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: budgets
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:ListTables
                - dynamodb:CreateTable
              Resource: "*"
      Events:
        ApiUpdate:
          Type: Api
          Properties:
            Path: /api/budget/{budget_id}
            Method: post
        ApiCreate:
          Type: Api
          Properties:
            Path: /api/budget
            Method: post
        ApiDelete:
          Type: Api
          Properties:
            Path: /api/budget/{budget_id}
            Method: delete

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"